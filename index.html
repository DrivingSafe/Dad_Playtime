<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>15분 놀이수첩</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B7A66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="놀이수첩">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 폰 한 손 사용 기준. 상단은 아이 이름·월령 한 줄, 하단 고정 탭 4개, 본문은 "지금 할 것" 카드 한 장 + 접이식 보조 항목. 초록 계열 한 가지 포인트, 숫자는 Do Hyeon. */
:root{
  --bg:#F3F6F2; --card:#FFFFFF; --ink:#1C2825; --ink2:#62716B; --line:#E1E7E2; --soft:#E9F2EE;
  --pri:#2B7A66; --pri-ink:#FFFFFF; --sun:#F6C85F; --sun-ink:#2B2310;
  --d-soc:#C0504D; --d-lang:#2B5FB0; --d-cog:#7A4FA0; --d-mov:#1F7F8C;
  --lv1:#C98A12; --lv2:#2E8B57; --warn-bg:#FFF5DB; --warn-line:#EBD088; --bad:#C65A55;
  --shadow:0 1px 2px rgba(20,45,38,.06),0 6px 18px rgba(20,45,38,.05);
  --f-num:'Do Hyeon','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --card:#17201D; --ink:#E6EEEA; --ink2:#94A49D; --line:#26312D; --soft:#1E2B27;
    --pri:#5DBBA4; --pri-ink:#0D1A16; --sun:#E2B34A; --sun-ink:#1B1608;
    --d-soc:#E88A85; --d-lang:#86ABEA; --d-cog:#BC9CDF; --d-mov:#5CC0CE;
    --lv1:#E3B04B; --lv2:#5FC48A; --warn-bg:#2B2614; --warn-line:#6B5A22; --bad:#E88A85; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --card:#17201D; --ink:#E6EEEA; --ink2:#94A49D; --line:#26312D; --soft:#1E2B27;
  --pri:#5DBBA4; --pri-ink:#0D1A16; --sun:#E2B34A; --sun-ink:#1B1608;
  --d-soc:#E88A85; --d-lang:#86ABEA; --d-cog:#BC9CDF; --d-mov:#5CC0CE;
  --lv1:#E3B04B; --lv2:#5FC48A; --warn-bg:#2B2614; --warn-line:#6B5A22; --bad:#E88A85; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.wrap{max-width:560px;margin:0 auto}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0 14px}
.who{font-size:13px;color:var(--ink2)}
.age{font-family:var(--f-num);font-size:30px;line-height:1.1}
.age small{font-size:16px;margin:0 4px 0 1px;color:var(--ink2)}
.pill-btn{font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.pill-btn[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav{display:flex;max-width:560px;margin:0 auto}
nav button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11px;font-weight:700;padding:6px 0;border:0;background:none;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--pri)}
nav .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;line-height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-style:normal;text-align:center;padding:0 4px}
nav button:focus-visible,.btn:focus-visible,.seg button:focus-visible,summary:focus-visible,input:focus-visible,.pill-btn:focus-visible{outline:3px solid var(--d-lang);outline-offset:2px}
main{display:flex;flex-direction:column;gap:14px}
.card,.hero,.fold{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-width:0}
.card,.hero{padding:18px}
.hero,.today-card{padding:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--ink2);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{font:inherit;font-weight:700;border:0;background:var(--pri);color:var(--pri-ink);border-radius:14px;padding:13px 18px;cursor:pointer}
.btn.big{width:100%;font-size:17px;padding:16px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:99px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;padding:6px 0}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:3px;gap:3px;max-width:100%}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;padding-inline:4px;white-space:nowrap}
.seg button{font:inherit;font-size:14px;font-weight:500;background:transparent;color:var(--ink2);border:0;border-radius:11px;padding:10px 12px;cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);font-weight:700}
.seg button:disabled{cursor:not-allowed;opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:currentColor}
.c-soc{color:var(--d-soc)}.c-lang{color:var(--d-lang)}.c-cog{color:var(--d-cog)}.c-mov{color:var(--d-mov)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.order{font-family:var(--f-num);font-weight:400;font-size:30px;line-height:1.2;margin:6px 0 10px}
.src{font-size:12px;color:var(--ink2)}
.status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.status.ok{background:var(--lv2);color:#fff}
.status.todo{background:var(--sun);color:var(--sun-ink)}
:root[data-theme="dark"] .status.ok{color:#0D1A16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .status.ok{color:#0D1A16}}
ol.steps{margin:14px 0 4px;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;position:relative;padding-left:32px;font-size:16px;line-height:1.5}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--pri);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.extra{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px}
.timerbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.timer{font-family:var(--f-num);font-size:60px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.btn.go{min-width:112px;font-size:18px;padding:16px 22px;border-radius:99px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.field input{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:12px;width:100%;min-width:0}
.q{font-size:13px;color:var(--ink2);margin:14px 0 6px}
.msg{border-radius:14px;padding:11px 14px;background:var(--soft);font-size:14px}
.msg.praise{background:color-mix(in srgb,var(--lv2) 16%,var(--card))}
.msg.push{background:var(--warn-bg)}
.msg small{display:block;color:var(--ink2);font-size:11px;margin-top:2px}
.msg .by{font-size:11px;font-weight:700;color:var(--ink2);display:block}
.msgbox{display:flex;flex-direction:column;gap:8px}
.msglist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.msglist button{text-align:left}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;font-weight:700;font-size:14px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin:-4px 2px 0 0;flex:none;transition:transform .2s}
.fold[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.fold>summary .sub{font-weight:400;font-size:13px;color:var(--ink2);margin-left:6px}
.fbody{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.item{padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0;padding-top:0}
.item ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:12px;padding:8px 12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink2)}
.tag.ok{background:var(--lv2);color:#fff}
:root[data-theme="dark"] .tag.ok{color:#0D1A16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.ok{color:#0D1A16}}
.lib{padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lib:first-of-type{border-top:0;padding-top:0}
.lib ol{margin:0;padding-left:20px;font-size:13px;color:var(--ink2)}
.bigstat{display:flex;align-items:baseline;gap:6px;margin:6px 0 12px}
.bigstat b{font-family:var(--f-num);font-weight:400;font-size:56px;line-height:1}
.bigstat span{font-size:18px;color:var(--ink2)}
.bigstat em{font-style:normal;margin-left:auto;font-size:13px;font-weight:700;color:var(--pri)}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.dd i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--soft);display:block}
.dd.on i{background:var(--pri)}
.summary{font-size:15px;line-height:1.6;text-wrap:pretty}
.summary b{background:linear-gradient(transparent 62%,var(--sun) 62%)}
.dom-row{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.dom-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dom-head .n{font-weight:700}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:currentColor}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.lv0{background:var(--soft);color:var(--ink2)}
.lv1{background:var(--lv1);color:#fff}
.lv2{background:var(--lv2);color:#fff}
:root[data-theme="dark"] .lv1,:root[data-theme="dark"] .lv2{color:#0D1A16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv1,:root:not([data-theme="light"]) .lv2{color:#0D1A16}}
.msgrid{display:flex;flex-direction:column}
.msgrid div,.erow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.msgrid div:first-child{border-top:0}
.erow button{font:inherit;font-size:12px;padding:6px 10px;border:0;border-radius:99px;background:var(--soft);color:var(--ink);cursor:pointer;flex:none}
.notice{background:var(--warn-bg);border-radius:16px;padding:14px 16px;font-size:14px}
ul.plain{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.empty{padding:14px;border-radius:14px;background:var(--soft);color:var(--ink2);font-size:14px}
.lead{font-size:14px;color:var(--ink2);padding:0 2px}
.lead b{color:var(--ink);font-family:var(--f-num);font-weight:400;font-size:18px}
.ms{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.ms:first-of-type{border-top:0}
.ms details summary{cursor:pointer;list-style:none;font-size:15px;line-height:1.45}
.ms details summary::-webkit-details-marker{display:none}
.ms .how{font-size:13px;color:var(--ink2);margin-top:4px}
.ms .seg button{padding:9px 6px;font-size:13.5px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pos div{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.pos b{font-family:var(--f-num);font-weight:400;font-size:38px;line-height:1}
.pos b small{font-size:15px;margin-left:2px;color:var(--ink2)}
.pos span{font-size:12px;color:var(--ink2)}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.step input{text-align:center;font-family:var(--f-num);font-size:28px;min-width:0;padding:8px;background:var(--soft);color:var(--ink);border:1px solid transparent;border-radius:12px;width:100%}
.step button{font:inherit;font-size:24px;font-weight:700;height:48px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);cursor:pointer}
.ch{width:100%;height:auto;display:block}
.ch text{font-family:var(--f-body);font-size:11px;fill:var(--ink2)}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .ref{fill:none;stroke:var(--ink2);stroke-width:1;opacity:.5}
.ch .ref50{fill:none;stroke:var(--ink2);stroke-width:1.6}
.ch .agg{fill:none;stroke:var(--d-lang);stroke-width:1.6;stroke-dasharray:4 3}
.ch .aggp{fill:var(--d-lang)}
.ch .me{fill:none;stroke:var(--pri);stroke-width:2.4}
.ch .mep{fill:var(--sun);stroke:var(--pri);stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--pri);vertical-align:middle;margin-right:5px}
.legend i.a{border-top:2px dashed var(--d-lang)}
.legend i.r{border-top:2px solid var(--ink2);opacity:.6}
.feat{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.feat:first-of-type{border-top:0}
.chlog{font-size:13px;color:var(--ink2)}
.chlog b{color:var(--ink)}
.wheels{position:relative;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:6px}
.wheel{height:200px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);touch-action:pan-y}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:80px}
.wi{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-size:20px;font-weight:700;color:var(--ink2);cursor:pointer;user-select:none}
.wi small{font-size:12px;font-weight:400;margin-left:2px}
.wi.off{opacity:.25}
.wheels .band{position:absolute;left:0;right:0;top:80px;height:40px;background:var(--soft);border-radius:12px;pointer-events:none;opacity:.55;mix-blend-mode:multiply}
.foot{margin-top:18px;font-size:12px;color:var(--ink2);line-height:1.6}
.foot summary{cursor:pointer;font-weight:700}
.foot p{margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}

/* ===== v0.7.2 모바일 보정 ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
button,summary,.seg button,.pill-btn,nav button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font-size:16px}
header.top{padding-top:calc(18px + env(safe-area-inset-top,0px))}
.btn.sm{min-height:40px}
.seg button{min-height:44px}
nav button{min-height:52px}
summary{min-height:44px;display:flex;align-items:center}
.wheel{touch-action:pan-y}
@media (max-width:360px){.age{font-size:26px}.order{font-size:26px}.timer{font-size:52px}}

/* ===== v0.8 스크롤 여백·개발자 패널 ===== */
.hero .q,#ssave{scroll-margin-top:16px;scroll-margin-bottom:120px}
#dev{position:fixed;right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30}
#devtog{font:inherit;font-size:12px;font-weight:700;width:46px;height:46px;border-radius:50%;border:0;background:#22303A;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);opacity:.9}
#devtog.shifted{background:#D9822B}
#devbody{position:fixed;left:10px;right:10px;bottom:calc(132px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:14px;font-size:13px;-webkit-overflow-scrolling:touch}
#devbody[hidden]{display:none}
nav button[hidden]{display:none}
.dv-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
.dv-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dv-row input{font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.dv-t{width:100%;border-collapse:collapse;font-size:12.5px}
.dv-t td{padding:4px 6px;border-top:1px solid var(--line)}

/* ===== v0.10 카드 탐색·고르기 버튼 통일·추천 ===== */
.navrow{display:flex;align-items:center;gap:8px}
.navbtn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);font-size:28px;line-height:1;padding:0 0 3px;cursor:pointer;touch-action:manipulation}
.navbtn:active{background:var(--line)}
.navmid{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center}
.navcount{font-size:12px;color:var(--ink2)}
.pickrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.pickrow>b{flex:1;min-width:0}
.pickbtn{flex:0 0 96px;width:96px;text-align:center;white-space:nowrap;padding:8px 6px}
.pickbtn.picked{display:inline-block;font-size:13px;font-weight:700;color:var(--pri);padding:8px 6px}
.rec{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.rec:first-of-type{border-top:0}
.rec .why{font-size:12.5px;color:var(--ink2)}

/* ===== v0.11 도구·책 가이드, 안전 약속 ===== */
.trow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.trow>b{flex:1;min-width:0}
.tcat{font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 2px}
.tool{padding:10px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.tool:first-of-type{border-top:0}
.ttip{font-size:14px}
.tmeta{font-size:12px;color:var(--ink2)}
.tnote{font-size:12.5px;background:var(--warn-bg);border-radius:12px;padding:9px 12px;margin:0}
.bex{margin-top:4px;background:var(--soft);border-radius:12px;padding:6px 12px}

function need(card){return card.ms.reduce((s,id)=>s+(2-lv(id)),0)}
function cardPool(){
  const mo=ageFloat(),ok=c=>DRAFT()||c.ready!==false,dist=c=>mo<c.age[0]?c.age[0]-mo:mo>=c.age[1]?mo-c.age[1]+.01:0;
  const inside=CARDS.filter(c=>ok(c)&&dist(c)===0);if(inside.length>=4)return inside;
  /* 월령에 맞는 카드가 4개 미만이면 월령 범위가 가장 가까운 카드로 채운다 */
  return CARDS.filter(ok).sort((a,b)=>dist(a)-dist(b)||CARDS.indexOf(a)-CARDS.indexOf(b)).slice(0,Math.max(4,inside.length));
}
function ranked(){return cardPool().slice().sort((a,b)=>need(b)-need(a)||CARDS.indexOf(a)-CARDS.indexOf(b))}
function dayAgo(n){const d=new Date();d.setDate(d.getDate()-n);return ymd(d)}
function domScore(d){const l=MS.filter(m=>m.d===d);const got=l.filter(m=>lv(m.id)===2).length;const pts=l.reduce((s,m)=>s+lv(m.id),0);return{n:l.length,got,pct:Math.round(pts/(2*l.length)*100)}}
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--)out.push(dayAgo(i));return out}

function streak(){let n=0;const d=new Date();if(!minsOn(ymd(d)))d.setDate(d.getDate()-1);while(minsOn(ymd(d))>0){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- 성장 계산 (LMS 기준표는 ref/* 문서에 있을 때만 사용) ---------- */
const refKey=k=>(k==='h'?'lfa_':'wfa_')+S.cfg.sex;
function lmsAt(key,mo){
  const r=S.ref[key];if(!r||!r.length)return null;
  if(mo<r[0][0]||mo>r[r.length-1][0])return null;
  let i=0;while(i<r.length-1&&r[i+1][0]<=mo)i++;
  const a=r[i],b=r[Math.min(i+1,r.length-1)];
  if(a===b||b[0]===a[0])return{L:a[1],M:a[2],S:a[3]};
  const t=(mo-a[0])/(b[0]-a[0]);
  return{L:a[1]+(b[1]-a[1])*t,M:a[2]+(b[2]-a[2])*t,S:a[3]+(b[3]-a[3])*t};
}
function zOf(kind,mo,x){const p=lmsAt(refKey(kind),mo);if(!p)return null;return p.L===0?Math.log(x/p.M)/p.S:(Math.pow(x/p.M,p.L)-1)/(p.L*p.S)}
function valAt(kind,mo,z){const p=lmsAt(refKey(kind),mo);if(!p)return null;return p.L===0?p.M*Math.exp(p.S*z):p.M*Math.pow(1+p.L*p.S*z,1/p.L)}
function cdf(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const hard=(h,w)=>h>=40&&h<=140&&w>=2&&w<=40;
function aggRows(sex){
  const m=new Map();
  for(const g of S.growth)for(const r of Object.values(g.rows||{})){if(r&&r.ck)m.set(r.ck+'_'+Math.round(r.m),r)}
  const out=[];
  for(const r of m.values()){
    if(r.x||r.s!==sex||!hard(r.h,r.w))continue;
    const zh=zOf('h',r.m,r.h),zw=zOf('w',r.m,r.w);
    if((zh!=null&&Math.abs(zh)>4)||(zw!=null&&Math.abs(zw)>4))continue;
    out.push(r);
  }
  return out;
}
function aggMean(kind){
  if(E.noAgg||E.local)return {};
  const rows=aggRows(S.cfg.sex),b={};
  for(const r of rows){const k=Math.round(r.m);(b[k]=b[k]||[]).push(r[kind])}
  const o={};for(const k in b)o[k]={mean:b[k].reduce((s,x)=>s+x,0)/b[k].length,n:b[k].length};
  return o;
}
async function contribute(rec){
  if(E.noAgg||!E.db||!E.uid||!S.cfg.ck)return;
  try{
    const ref=E.db.doc('growth/'+E.uid);const s=await ref.get();
    const rows=Object.assign({},(s.exists&&s.data().rows)||{});
    rows[S.cfg.ck+'_'+Math.round(rec.mo)]={ck:S.cfg.ck,m:rec.mo,s:S.cfg.sex,h:rec.h,w:rec.w,x:rec.x?1:0};
    await ref.set({rows});
  }catch(e){}
}
function trySaveBody(){
  const h=E.gh,w=E.gw;

  const mo=ageFloat(),zh=zOf('h',mo,h),zw=zOf('w',mo,w);

}

let BOOKS={cats:[],books:[]};
async function loadBooks(){try{const r=await fetch('data/books.json');if(r.ok){BOOKS=await r.json();render()}}catch(e){}}
const CAT=id=>(BOOKS.cats||[]).find(c=>c.id===id);
const shelfBooks=()=>(S.shelf||[]).filter(x=>!x.del);
const inAges=(a,mo)=>!a||(mo>=a[0]&&mo<=a[1]+.99);

function bookLinks(t){

}
/* 오늘의 책 후보: ① 우리집 책장 ② 카테고리 읽기 카드("집에 있는 ○○ 책 아무거나") ③ 확인된 추천 책 ④ 북스타트 등 */
function bookById(id){
  if(id.startsWith('sh:')){const x=(S.shelf||[]).find(s=>'sh:'+s.id===id&&!s.del);if(!x)return null;const c=CAT(x.cat)||{};
    return{id,name:x.title,kind:'shelf',cat:x.cat,tip:c.tip||'아이와 함께 그림을 보며 읽어요',label:'우리집 책장'+(c.name?' · '+c.name:''),note:'',shelfId:x.id}}
  if(id.startsWith('cg:')){const c=CAT(id.slice(3));if(!c)return null;
    return{id,name:`집에 있는 ${c.name} 책 아무거나`,kind:'cat',cat:c.id,tip:c.tip,label:c.name+' · 읽는 법',note:''}}
  if(id.startsWith('bk:')){const b=(BOOKS.books||[]).find(x=>'bk:'+x.id===id);if(!b)return null;const c=CAT(b.cat)||{};
    return{id,name:b.series?`${b.series} - ${b.title}`:b.title,kind:'catalog',cat:b.cat,tip:c.tip,label:[c.name,b.pub].filter(Boolean).join(' · '),note:b.note||'',raw:b}}
  const t=toolById(id);if(!t)return null;
  return Object.assign({},t,{kind:'tool',label:`${srcLabel(t.src)} · ${RELN[t.rel]||t.rel}`});
}
function bookIds(all){
  const mo=ageFloat(),ids=[];
  shelfBooks().forEach(s=>ids.push('sh:'+s.id));
  (BOOKS.cats||[]).filter(c=>c.id!=='series').forEach(c=>{if(all||inAges(c.ages,mo))ids.push('cg:'+c.id)});
  (BOOKS.books||[]).forEach(b=>{if((all||inAges(b.age,mo))&&!shelfBooks().some(s=>s.cid===b.id))ids.push('bk:'+b.id)});
  (TOOLS.tools||[]).filter(t=>t.track==='A'&&t.cat==='book'&&(all||inShow(t,mo))).forEach(t=>ids.push(t.id));
  return ids;
}
const bookCandidates=all=>bookIds(all).map(bookById).filter(Boolean);
const bookPool=()=>bookCandidates(false);
/* 책장이 있으면 책장 책부터, 없으면 카테고리(동물→자연→숫자…)를 날짜마다 돌려 가며 */
function recBookId(){
  const pool=bookPool();if(!pool.length)return null;
  const recent=new Set(S.plays.filter(p=>p.date>=dayAgo(5)&&p.kind==='book').map(p=>p.card));
  const f=k=>pool.filter(b=>b.kind===k&&!recent.has(b.id));
  const c=f('shelf').length?f('shelf'):f('cat').length?f('cat'):pool.filter(b=>!recent.has(b.id)).length?pool.filter(b=>!recent.has(b.id)):pool;
  return c[dayNum()%c.length].id;
}
async function shelfAdd(title,cat,cid){
  const t=(title||'').trim();if(!t)return false;
  if(shelfBooks().some(s=>s.title===t||(cid&&s.cid===cid))){toast('이미 책장에 있어요.');return false}
  const ts=Date.now(),id='s'+ts,rec={title:t.slice(0,60),cat:cat||'',cid:cid||'',ts};
  S.shelf.unshift(Object.assign({id},rec));toast('우리집 책장에 넣었어요.');
  try{await put('shelf/'+id,rec)}catch(e){}
  return true;
}
async function shelfDel(id){
  const s=S.shelf.find(x=>x.id===id);if(!s)return;s.del=1;toast('책장에서 뺐어요.');
  try{await put('shelf/'+id,{title:s.title,cat:s.cat,cid:s.cid||'',ts:s.ts,del:1})}catch(e){}
}
async function shelfToggle(bk){
  const b=(BOOKS.books||[]).find(x=>x.id===bk);if(!b)return;
  const s=shelfBooks().find(x=>x.cid===b.id);
  if(s)await shelfDel(s.id);else await shelfAdd(b.title,b.cat,b.id);
}
function catSuggest(catId){
  const c=CAT(catId)||{},L=(BOOKS.books||[]).filter(b=>b.cat===catId).slice(0,4);
  const rows=L.map(b=>{const own=shelfBooks().some(s=>s.cid===b.id);
    return `<div class="sugg"><span><b>${esc(b.series?b.series+' - '+b.title:b.title)}</b><small>${esc([b.pub,b.ages].filter(Boolean).join(' · '))}</small></span><button class="btn ghost sm" data-shelftoggle="${b.id}">${own?'✓ 책장에 있음':'책장에 추가'}</button></div>`}).join('');
  return `<div class="tcat">이런 ${esc(c.name||'')} 책이 있어요</div>${rows||`<p class="tmeta">확인된 한국어 책을 아직 찾지 못했어요. 집에 있는 책을 직접 등록하거나 검색해 보세요. <a href="https://search.naver.com/search.naver?query=${qs('0~3세 '+(c.name||'')+' 보드북')}" target="_blank" rel="noopener">검색</a></p>`}
  <div style="margin-top:6px"><button class="link" data-shelfopen="${esc(catId)}">+ 우리집에 있는 ${esc(c.name||'')} 책 등록</button></div>`;
}

  const keys={};
  try{[DEV.on?'dpn_db_dev':'dpn_db',...BK_KEYS].forEach(k=>{const v=localStorage.getItem(k);if(v!=null)keys[k]=v})}catch(e){}
  const blob=new Blob([JSON.stringify({app:'15min-play-notebook',v:1,saved:new Date().toISOString(),keys})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='놀이수첩-백업-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  toast('백업 파일을 저장했어요.');
}
function importData(file){
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const o=JSON.parse(rd.result);if(!o||o.app!=='15min-play-notebook'||!o.keys)throw new Error('형식');
      if(!confirm('이 기기의 기록을 백업 파일 내용으로 바꿔요. 계속할까요?'))return;
      Object.keys(o.keys).forEach(k=>{if(k==='dpn_db'||k==='dpn_db_dev'||BK_KEYS.includes(k))localStorage.setItem(k,o.keys[k])});
      toast('불러왔어요. 다시 시작해요.');setTimeout(()=>location.reload(),600);
    }catch(e){toast('백업 파일이 아니에요.')}
  };
  rd.readAsText(file);
}

  ${isStandalone()?'':(DEFERRED?'<button class="btn" data-install>앱 설치하기</button>':'<p class="muted">안드로이드 크롬: 메뉴(⋮) → 앱 설치. 아이폰: 사파리 공유 버튼 → 홈 화면에 추가.</p>')}</section>`;

function recPlayId(){
  const recent=new Set(S.plays.filter(p=>p.date>=dayAgo(5)).map(p=>p.card));
  let pool=ranked().filter(c=>!recent.has(c.id));if(pool.length<4)pool=ranked();
  const top=pool.slice(0,6);return top.length?top[dayNum()%top.length].id:null;
}
/* 오늘 무엇을 보여 줄지: 시작해서 잠근 것 > (엄마 지시보다 늦게) 내가 고른 것 > 엄마 지시 > 시스템 추천. 새로고침해도 그대로 */
function resolveItem(kind){
  if(PICK.date!==today())PICK={date:today()};
  const lock=PICK[kind+'Lock'],pid=PICK[kind+'Id'],pts=PICK[kind+'Ts']||0;
  const valid=id=>!!id&&(kind==='play'?!!cardById(id):!!bookById(id));
  const asId=kind==='play'?S.assign[today()]:S.assignBook[today()],ats=S.assignTs[today()]||0;
  if(valid(pid)&&(lock||!asId||pts>ats))return{id:pid,why:'mine'};
  if(valid(asId)&&!S.plays.some(p=>p.date===today()&&p.card===asId&&p.ts>ats))return{id:asId,why:'mom'};
  return{id:kind==='play'?recPlayId():recBookId(),why:'rec'};
}
function pickToday(){return resolveItem('play').id}
function selectItem(kind,id,toTop){
  PICK[kind+'Id']=id;PICK[kind+'Ts']=Date.now();PICK[kind+'Lock']=false;pickSave();
  E.cardId=resolveItem('play').id;render();
  if(toTop)scrollTopSoon();
}
let NAV_BUSY=false;
function navItem(kind,n,fromDrag){
  const list=itemList(kind);if(list.length<2)return;
  const cur=resolveItem(kind).id;let i=list.findIndex(x=>x.id===cur);if(i<0)i=0;
  const j=(i+n+list.length)%list.length,sl=document.querySelector('#card-'+kind+' .mslide');
  const go=()=>{NAV_BUSY=false;selectItem(kind,list[j].id);const ns=document.querySelector('#card-'+kind+' .mslide');if(ns){ns.classList.add(n>0?'enter-r':'enter-l');ns.addEventListener('animationend',()=>ns.classList.remove('enter-r','enter-l'),{once:true})}};
  if(NAV_BUSY)return;NAV_BUSY=true;
  if(sl&&!fromDrag){sl.style.transition='transform .16s ease-in,opacity .16s';sl.style.transform=`translateX(${n>0?-44:44}px)`;sl.style.opacity='0';setTimeout(go,160)}else go();
}
const pickBtn=(kind,id,curId)=>id===curId?'<span class="pickbtn picked">선택됨</span>':`<button class="btn ghost sm pickbtn" data-pick="${kind}:${id}">고르기</button>`;

/* ---------- 오늘 놀이 시간(하루 목표)과 활동: 카드마다 정해진 시간은 없다 ----------
   첫 놀이를 시작하면 그날의 카운트다운이 시작되고, 놀이는 끝날 때마다 "완료"로 마친다.
   완료하면 다음 추천이 나오고, 하루가 끝나면 오늘 완료한 것을 한 번에 엄마에게 보고한다.
   끝나는 시각과 진행 중인 놀이를 저장하므로 새로고침해도 이어진다. */
const DAY_KEY='dpn_day',ACT_KEY='dpn_act',GOAL_KEY='dpn_goal';
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let GOAL=lsGet(GOAL_KEY,15);
const newDay=()=>({date:today(),goal:GOAL,start:0,end:0,state:'idle',lastReport:0,goalShown:false});
let DAY=(()=>{const o=lsGet(DAY_KEY,null);return o&&o.date===today()?o:newDay()})();
let ACT=(()=>{const o=lsGet(ACT_KEY,null);return o&&o.date===today()?o:null})();
let TICK=null,FIN=null,AC=null,WL=null;
const daySave=()=>lsSet(DAY_KEY,DAY),actSave=()=>lsSet(ACT_KEY,ACT);
function dayEnsure(){if(DAY.date!==today()){DAY=newDay();daySave()}if(ACT&&ACT.date!==today()){ACT=null;actSave()}}
const dayActive=()=>DAY.state==='running'||DAY.state==='over';
const dayRemain=()=>Math.max(0,Math.ceil((DAY.end-Date.now())/1000));
const todayPlays=()=>S.plays.filter(p=>p.date===today());
const unreported=()=>todayPlays().filter(p=>p.ts>(DAY.lastReport||0));
const sumMins=l=>l.reduce((s,p)=>s+p.mins,0);
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function askNotify(){try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
async function wakeOn(){try{if(navigator.wakeLock&&!WL)WL=await navigator.wakeLock.request('screen')}catch(e){}}
function wakeOff(){try{if(WL){WL.release();WL=null}}catch(e){}}
function alarm(){
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,700])}catch(e){}
  try{
    unlockAudio();if(AC){[0,.4,.8].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain(),at=AC.currentTime+t;o.frequency.value=i===2?988:784;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.4,at+.03);g.gain.exponentialRampToValueAtTime(.0001,at+.32);o.start(at);o.stop(at+.34)})}
  }catch(e){}
  try{
    if('Notification' in window&&Notification.permission==='granted'){
      const o={body:'오늘 목표 시간이 됐어요. 앱을 열어 마무리하고 엄마에게 보고해 주세요.',icon:'icons/icon-192.png',tag:'dpn-timer',vibrate:[200,100,200]};
      if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification('시간이 끝났어요',o));else new Notification('시간이 끝났어요',o);
    }
  }catch(e){}
}
function ensureTick(){if(!TICK)TICK=setInterval(timerTick,1000);timerTick()}
function paintBar(){
  const bar=document.getElementById('minibar');if(!bar)return;
  if(!dayActive()&&!ACT){bar.hidden=true;document.body.classList.remove('hasbar');return}
  const over=DAY.state==='over';
  bar.hidden=false;document.body.classList.add('hasbar');bar.classList.toggle('done',over);
  bar.querySelector('.mb-title').textContent=ACT?ACT.title:'오늘 놀이 시간';
  bar.querySelector('.mb-sub').textContent=ACT?KINDN[ACT.kind]+' 진행 중'+(over?' · 목표 달성':''):(over?'목표 달성! 마무리해 주세요':'다음 놀이를 골라요');
  bar.querySelector('.mb-time').textContent=dayActive()?(over?'+'+fmt(Math.floor((Date.now()-DAY.end)/1000)):fmt(dayRemain())):'--:--';
  bar.querySelector('[data-mbend]').textContent=ACT?'완료':'보고';
}
function timerTick(){
  dayEnsure();
  if(!dayActive()&&!ACT){clearInterval(TICK);TICK=null;paintBar();return}
  if(DAY.state==='running'&&Date.now()>=DAY.end){DAY.state='over';DAY.goalShown=true;daySave();alarm();wakeOff();paintBar();render();openGoalSheet();return}
  paintBar();
}
/* 놀이 시작: 처음이면 그날의 카운트다운도 같이 시작 */
function startActivity(kind,id){
  if(ACT){toast('진행 중인 놀이를 먼저 완료해 주세요.');return}
  const title=itemTitle(kind==='tool'?'tool':kind,id);if(!title)return;
  if(kind!=='tool'){PICK[kind+'Id']=id;PICK[kind+'Ts']=Date.now();PICK[kind+'Lock']=true;pickSave()}
  const now=Date.now();let first=false;
  if(!dayActive()){DAY.goal=GOAL;DAY.start=now;DAY.end=now+GOAL*60000;DAY.state='running';DAY.goalShown=false;daySave();first=true}
  ACT={kind,id,title,start:now,date:today()};actSave();
  unlockAudio();askNotify();wakeOn();ensureTick();render();
  toast(first?`오늘 ${GOAL}분 카운트가 시작됐어요!`:'시작! 끝나면 "완료"를 눌러요.');
}

function repRes(p){
  const a=p.kind==='book'?(p.i!=null?BRX[p.i]:''):(p.r!=null?RX[p.r]:'');
  return [a,p.b!=null?BK[p.b]:''].filter(Boolean).join(' · ');
}
/* 완료: 놀이 하나를 기록하고, 다음 추천을 보여 준다 */
async function doneActivity(){
  if(!ACT||!FIN)return;
  const t=ACT,f=FIN,ts=Date.now();
  const rec={card:t.id,kind:t.kind,t:t.title,mins:f.mins,ts,date:today()};
  if(t.kind==='book'){if(f.rx!=null)rec.i=f.rx}else{if(f.rx!=null)rec.r=f.rx}
  if(f.bk!=null)rec.b=f.bk;
  S.plays.unshift(Object.assign({id:'p'+ts},rec));
  if(t.kind!=='tool'){PICK[t.kind+'Id']=null;PICK[t.kind+'Lock']=false;pickSave()}
  ACT=null;actSave();FIN=null;sheetHide();paintBar();render();
  sheetShow(nextHTML(),'fin');
  try{await put('plays/p'+ts,rec)}catch(e){}
}
function cancelActivity(){ACT=null;actSave();FIN=null;sheetHide();paintBar();render()}
function nextHTML(){
  const L=todayPlays(),tot=sumMins(L),over=DAY.state==='over';
  const rem=over?'목표 시간을 채웠어요!':(dayActive()?`목표까지 ${Math.ceil(dayRemain()/60)}분 남았어요.`:'');
  return `<div class="sheet-grab"></div><h2>고생했어요! 🎉</h2><p class="muted">오늘 ${tot}분 · ${L.length}개 완료. ${rem}</p>
  <div class="fin-actions">${over?'':'<button class="btn big" data-fin="next">다음 놀이 고르기</button>'}<button class="btn ${over?'big':'ghost'}" data-fin="report">여기까지 · 엄마에게 보고하기</button>${over?'<button class="btn ghost" data-fin="next">더 하기</button>':''}</div>`;
}
/* 목표 시간이 끝났을 때 */
function openGoalSheet(){sheetShow(goalHTML(),'fin')}
function goalHTML(){
  if(ACT)return `<div class="sheet-grab"></div><h2>목표 시간이 됐어요! ⏰</h2><p class="muted">지금 하는 "${esc(ACT.title)}"을(를) 마치고 보고할 수 있어요. 더 하고 싶으면 시간을 늘려요.</p>
  <div class="fin-actions"><button class="btn big" data-fin="complete">놀이 완료하기</button><button class="btn ghost" data-fin="ext5">5분 더 하기</button></div>

  return `<div class="sheet-grab"></div><h2>오늘 목표를 채웠어요! 🎉</h2><p class="muted">오늘 ${sumMins(todayPlays())}분 · ${todayPlays().length}개 완료. 엄마에게 보고할까요?</p>
  <div class="fin-actions"><button class="btn big" data-fin="report">엄마에게 보고하기</button><button class="btn ghost" data-fin="ext5">5분 더 하기</button></div>
  <div style="margin-top:8px"><button class="link" data-fin="later">나중에</button></div>`;

function extendDay(){DAY.end=Math.max(DAY.end,Date.now())+5*60000;DAY.state='running';DAY.goalShown=false;daySave();wakeOn();sheetHide();paintBar();render();toast('5분 더 늘렸어요.')}
/* 오늘 마무리 → 엄마에게 한 번에 보고 */
function buildReport(L){
  const rows=L.slice().reverse().map(p=>`• ${KINDN[p.kind||'play']} · ${p.t||p.card} · ${p.mins}분${repRes(p)?' · '+repRes(p):''}`);
  return `오늘 놀이 ${sumMins(L)}분 (목표 ${DAY.goal||GOAL}분) · ${L.length}개 완료\n`+rows.join('\n');
}
function openReport(){
  if(ACT){toast('진행 중인 놀이를 먼저 완료해 주세요.');openComplete();return}

}

/* 오늘 화면: 목표 시간 고르기(시작 전) / 오늘 한 것 */

/* ---------- 시트(아래에서 올라오는 창 / 전체 화면 도감) ---------- */

function sheetHide(){const s=document.getElementById('sheet');s.hidden=true;s.innerHTML='';s.className='';document.body.classList.remove('noscroll')}
const sheetOpen=()=>!document.getElementById('sheet').hidden;

/* ---------- 오늘의 놀이·도서 카드 (뒤에 카드가 겹쳐 있고, 좌우로 넘기면 움직인다) ---------- */
function missionCard(kind){
  const P=resolveItem(kind);
  if(!P.id)return kind==='book'?`<section class="card"><div class="eyebrow">오늘의 도서</div><p class="muted" style="margin-top:6px">${(TOOLS.tools||[]).length?'이 월령에 맞는 도서가 아직 없어요.':'도서 목록을 불러오는 중이에요…'}</p></section>`:'';
  const list=itemList(kind),idx=Math.max(0,list.findIndex(x=>x.id===P.id)),nxt=list.length>1?list[(idx+1)%list.length]:null;
  const active=!!ACT&&ACT.kind===kind&&ACT.id===P.id,busy=!!ACT;
  const doneMin=S.plays.filter(p=>p.date===today()&&(p.kind||'play')===kind).reduce((s,p)=>s+p.mins,0);
  const isRecId=P.id===(kind==='play'?recPlayId():recBookId()),why=P.why==='mine'&&isRecId?'rec':P.why;
  const tag={rec:'추천',mom:'엄마 지시',mine:'내가 고름'}[why];
  let title,chips,body,extra='',alt='';
  if(kind==='play'){
    const c=cardById(P.id);title=c.t;
    chips=c.doms.map(d=>`<span class="chip ${DOM[d].c}">${DOM[d].n}</span>`).join('')+`<span class="src">${esc(c.src)}</span>`;
    body=`<ol class="steps">${c.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
    if(GOAL>=30)extra=`<div class="extra"><b>30분 확장</b> ${esc(c.x30)}</div>`;
  }else{
    const t=bookById(P.id);title=t.name;
    const cn=(CAT(t.cat)||{}).name||'';
    chips=`<span class="chip">${t.kind==='shelf'?'우리집 책장':t.kind==='cat'?cn+' 책':t.kind==='catalog'?'추천 책':(t.type==='named'?'실제 도서':'도서 유형')}</span><span class="src">${esc(t.label||'')}</span>`;
    body=`<ol class="steps"><li>${esc(t.tip&&t.tip!=='—'?t.tip:'아이와 함께 그림을 보며 읽어요')}</li></ol>${t.note?`<p class="tmeta">${esc(t.note)}</p>`:''}`;
    if(t.kind==='cat')alt=catSuggest(t.cat);
    else if(t.kind==='catalog'||(t.kind==='tool'&&t.type==='named'&&t.avail==='unverified'))alt='<p class="tmeta">우리집에 없으면 도서관에서 빌리거나 서점에서 찾아보세요.</p>'+bookLinks(t)+(t.kind==='catalog'&&t.raw?`<div style="margin-top:6px"><button class="btn ghost sm" data-shelftoggle="${t.raw.id}">${shelfBooks().some(x=>x.cid===t.raw.id)?'✓ 책장에 있음':'우리집에 있어요 (책장에 추가)'}</button></div>`:'');
  }
  const label=active?'진행 중… 위에서 완료를 눌러요':busy?'다른 놀이 진행 중':dayActive()?'이걸로 하기':`이걸로 시작 · 오늘 ${GOAL}분 카운트`;
  const inner=`<section class="mcard" id="card-${kind}" data-kind="${kind}">
    <div class="navrow"><button class="navbtn" data-cnav="${kind}:-1" aria-label="이전" ${list.length<2?'disabled':''}>‹</button>
      <div class="navmid"><span class="eyebrow">${kind==='play'?'오늘의 놀이':'오늘의 도서'}</span><span class="navcount">${idx+1} / ${list.length} · ${tag}</span></div>
      <button class="navbtn" data-cnav="${kind}:1" aria-label="다음" ${list.length<2?'disabled':''}>›</button></div>
    <div class="mslide" data-kind="${kind}">
    <div class="row between" style="margin-top:8px">${doneMin?`<span class="status ok">${doneMin}분 완료</span>`:'<span class="status todo">아직 안 함</span>'}${why==='rec'?'':`<button class="link" data-crec="${kind}">추천으로 돌아가기</button>`}</div>
    <h1 class="order">${esc(title)}</h1>
    <div class="chips">${chips}</div>${body}${alt}${extra}
    </div>
    <div class="mfoot"><button class="btn go" data-start="${kind}" ${busy?'disabled':''}>${label}</button></div>
  </section>`;
  return `<div class="stack" data-kind="${kind}">${list.length>2?'<div class="behind b2"></div>':''}${nxt?`<div class="behind b1"><span>다음 · ${esc(kind==='play'?nxt.t:nxt.name)}</span></div>`:''}${inner}</div>`;
}

/* ---------- 발달 체크인: 요즘 이걸 잘 하나요? (3주 넘게 안 물어본 항목을 하루 최대 3개) ---------- */
function ckLoad(){try{const o=JSON.parse(localStorage.getItem('dpn_ck')||'{}');return o.date===today()?o:{date:today(),n:0,skip:false}}catch(e){return{date:today(),n:0,skip:false}}}
function ckSave(o){try{localStorage.setItem('dpn_ck',JSON.stringify(o))}catch(e){}}
function ckCandidate(){const now=Date.now(),c=MS.filter(m=>{const r=S.ms[m.id];return !r||!r.at||now-r.at>21*864e5});return c.length?c[dayNum()%c.length]:null}
function checkinCard(){
  if(!E.cfgSet)return '';
  const ck=ckLoad();if(ck.skip||ck.n>=3)return '';
  const m=ckCandidate();if(!m)return '';
  return `<section class="card" id="ckcard"><div class="eyebrow">발달 체크인 · ${CURSET}개월</div><p class="ckq">요즘 이거 잘 하나요?</p><h2 style="margin:2px 0">${esc(m.t)}</h2><p class="muted">${esc(m.how)}</p>

}

/* ---------- 도감: 전체 화면 시트. 탭(놀이·도서·도구) + 필터 칩 + 2열 카드 → 눌러서 자세히 → 고르기 ---------- */
const DOMF=Object.keys(DOM).map(d=>[d,DOM[d].n]);
function libFilters(){
  const t=E.lib.tab;
  if(t==='play')return [['all','전체'],['rec','추천'],...DOMF,['new','안 해 본 놀이'],['often','자주 한 놀이']];
  if(t==='book')return [['all','전체'],['mine','우리집 책장'],...(BOOKS.cats||[]).map(c=>[c.id,c.name]),['bs','북스타트·기관']];
  return [['all','전체'],...Object.keys(CATN).filter(c=>c!=='book').map(c=>[c,CATN[c]])];
}
function libItems(){
  const L=E.lib,mo=ageFloat(),T=TOOLS.tools||[];
  if(L.tab==='play'){
    let list=L.all?CARDS.filter(c=>DRAFT()||c.ready!==false):cardPool();
    const {byCard}=playStats(60);
    if(L.filter==='rec'){const ids=new Set(recommend(15).map(r=>r.c.id));list=list.filter(c=>ids.has(c.id))}
    else if(DOM[L.filter])list=list.filter(c=>c.doms.includes(L.filter));
    else if(L.filter==='new')list=list.filter(c=>!(byCard[c.id]||[]).length);
    else if(L.filter==='often')list=list.filter(c=>(byCard[c.id]||[]).length>=2);
    return list.map(c=>({kind:'play',id:c.id,title:c.t,doms:c.doms,meta:`${c.age[0]}~${Math.min(c.age[1],72)}개월`}));
  }
  if(L.tab==='book'){
    let l=bookCandidates(!!L.all);
    if(L.filter==='mine')l=l.filter(b=>b.kind==='shelf');
    else if(L.filter==='bs')l=l.filter(b=>b.kind==='tool');
    else if(L.filter!=='all')l=l.filter(b=>b.cat===L.filter);
    const kn={shelf:'우리집',cat:'읽는 법',catalog:'추천 책',tool:'기관'};
    return l.map(b=>({kind:'book',id:b.id,title:b.name,meta:kn[b.kind]+(b.cat&&CAT(b.cat)?' · '+CAT(b.cat).name:'')}));
  }
  const A=T.filter(t=>t.track==='A'&&(L.all||inShow(t,mo)));
  let l=A.filter(t=>t.cat!=='book');if(CATN[L.filter])l=l.filter(t=>t.cat===L.filter);
  return l.map(t=>({kind:'tool',id:t.id,title:t.name,meta:`${CATN[t.cat]} · ${t.show[0]}~${t.show[1]}개월`}));
}

function libRender(){const b=document.querySelector('#sheet .sheet-body');if(!b||!E.lib)return;const y=b.scrollTop;b.innerHTML=libHTML();b.scrollTop=E.lib.sel?0:y}
function sheetClick(e){

  if('joinconfirm' in d){const J=E.join;if(!J||!J.inv)return;famBusy('합류하는 중…');joinFamily(J.code,J.inv).then(r=>{if(r.err){E.join={code:J.code,err:r.err};sheetShow(joinHTML(),'fin')}else location.reload()});return}
  if(d.shelftoggle){shelfToggle(d.shelftoggle).then(()=>{if(E.lib)libRender();render()});return}
  if(d.shelfdel){shelfDel(d.shelfdel).then(()=>{if(E.lib){E.lib.sel=null;libRender()}render()});return}
  if('shelfform' in d){const i=document.getElementById('shelftitle');if(i&&E.lib)E.lib.addTitle=i.value;E.lib.addOpen=!E.lib.addOpen;libRender();return}
  if(d.shelfcat){const i=document.getElementById('shelftitle');if(i)E.lib.addTitle=i.value;E.lib.addCat=d.shelfcat;libRender();return}
  if('shelfsave' in d){const i=document.getElementById('shelftitle');const ti=i?i.value:'';shelfAdd(ti,E.lib.addCat,'').then(ok=>{if(ok){E.lib.addOpen=false;E.lib.addTitle='';E.lib.addCat='';libRender();render()}});return}
  if('libclose' in d||('sheetclose' in d&&E.lib)){E.lib=null;sheetHide();return}
  if('sheetclose' in d){if(ACT||sheetOpen()){sheetHide()}return}
  if(d.ltab){E.lib.tab=d.ltab;E.lib.filter='all';libRender();return}
  if(d.lfilter){E.lib.filter=d.lfilter;libRender();return}
  if(d.ltile){const [k,...r]=d.ltile.split(':');E.lib.sel={kind:k,id:r.join(':')};libRender();return}

  if(d.frx!==undefined&&FIN){FIN.rx=FIN.rx===Number(d.frx)?null:Number(d.frx);const b=document.querySelector('#sheet .sheet-body');b.innerHTML=completeHTML();return}
  if(d.fbk!==undefined&&FIN){FIN.bk=FIN.bk===Number(d.fbk)?null:Number(d.fbk);const b=document.querySelector('#sheet .sheet-body');b.innerHTML=completeHTML();return}
  if(d.fin){

    else if(f==='next'){sheetHide();scrollToSoon('#card-play','start')}else sheetHide();
  }
}

/* ---------- 추천: 최근 2주 놀이 기록 + 이정표 체크 + 아이 반응으로 '더 해볼 놀이'를 고른다 ---------- */
function playStats(days){
  const since=dayAgo(days),dom={soc:0,lang:0,cog:0,mov:0},byCard={};
  S.plays.forEach(pl=>{(byCard[pl.card]=byCard[pl.card]||[]).push(pl)});
  Object.values(byCard).forEach(a=>a.sort((x,y)=>y.ts-x.ts));
  S.plays.filter(pl=>pl.date>=since).forEach(pl=>{const c=cardById(pl.card);if(c)c.doms.forEach(d=>dom[d]++)});
  return{dom,byCard};
}
function recommend(n){
  const {dom,byCard}=playStats(14),vals=Object.values(dom),mean=vals.reduce((a,b)=>a+b,0)/vals.length;
  const cur=new Set(MS.map(m=>m.id));
  return cardPool().filter(c=>c.id!==resolveItem('play').id).map(c=>{
    let sc=0;const why=[];
    const open=c.ms.filter(id=>cur.has(id)&&lv(id)<2).sort((a,b)=>lv(a)-lv(b));
    if(open.length){sc+=open.reduce((a,id)=>a+(2-lv(id)),0)*2;why.push(`'${MSBY[open[0]].t.split(' (')[0]}' 항목이 아직이에요`)}
    const gap=c.doms.map(d=>({d,g:mean-dom[d]})).sort((a,b)=>b.g-a.g)[0];
    if(gap&&gap.g>0){sc+=gap.g*3;why.push(`최근 2주 ${DOM[gap.d].n} 놀이 ${dom[gap.d]}번`)}
    const hist=byCard[c.id]||[];
    if(!hist.length){sc+=3;why.push('아직 해 본 적 없는 놀이')}
    else{
      const last=hist[0],ago=Math.floor((Date.now()-last.ts)/864e5);
      if(ago<5)sc-=6;else if(ago>=14){sc+=1;why.push(ago+'일 전에 했어요')}
      if(last.r===2){sc-=2;why.push('지난번엔 힘들어했어요, 짧게 해 보기')}
      if(last.r===0){sc+=1;why.push('지난번에 잘 따라했어요')}
    }
    return{c,sc,why:why.slice(0,2)};
  }).sort((a,b)=>b.sc-a.sc||CARDS.indexOf(a.c)-CARDS.indexOf(b.c)).slice(0,n);
}
function recFold(){
  const c=cardById(resolveItem('play').id)||{id:''};
  const list=recommend(3);if(!list.length)return '';
  const {dom}=playStats(14),total=Object.values(dom).reduce((a,b)=>a+b,0);
  const bal=Object.keys(DOM).map(d=>`<span class="${DOM[d].c}">${DOM[d].n} ${dom[d]}</span>`).join(' · ');
  return `<details class="fold" data-k="rec"${isOpen('rec',true)?' open':''}><summary><span>더 해볼 놀이 추천<span class="sub">${total?'최근 2주 기록 기준':'기록이 쌓이면 정확해져요'}</span></span></summary><div class="fbody">
    <p class="muted">최근 2주 영역별 놀이: ${bal}</p>
    ${list.map(r=>`<div class="rec"><div class="pickrow"><b>${esc(r.c.t)}</b>${pickBtn('play',r.c.id,c.id)}</div><span class="why">${r.why.length?esc(r.why.join(' · ')):'다양하게 해 보기'}</span></div>`).join('')}</div></details>`;
}

/* ---------- 0~36개월 도구·책 데이터 (data/tools.json): 트랙 A(공공·의학 기관)가 뼈대, 트랙 B(엄마들 후기)는 A 유형 아래 '엄마들이 많이 쓰는 예' ---------- */
let TOOLS={tools:[],safety:[],sources:{}};
/* 북스타트처럼 한 줄에 여러 권이 묶인 도서는 한 권씩 펼친다 (오늘의 도서 카드는 한 권이어야 하므로) */
function expandBooks(list){
  const out=[];
  for(const t of list){
    if(!(t.track==='A'&&t.cat==='book'&&t.type==='named'&&t.name.includes(' / '))){out.push(t);continue}
    t.name.split(' / ').forEach((nm,i)=>{
      const base=nm.replace(/\s*\(.*$/,'').trim();
      const tip=t.tip&&t.tip.includes(base)?t.tip:'아이와 함께 그림을 보며 읽고, 본 것을 아이가 말하게 해요';
      out.push(Object.assign({},t,{id:t.id+'_'+i,name:nm,tip}));
    });
  }
  return out;
}

  const ys=[];ref.forEach(c=>c.pts.forEach(p=>ys.push(p[1])));aggPts.forEach(p=>ys.push(p[1]));mePts.forEach(p=>ys.push(p[1]));

const p2=n=>String(n).padStart(2,'0');
function wheelHTML(key,val){

  const col=(w,from,to,sel,u)=>{let h=`<div class="wheel" data-w="${w}" role="listbox" aria-label="${u}"><div class="pad"></div>`;for(let v=from;v<=to;v++)h+=`<div class="wi" data-v="${v}" role="option">${v}<small>${u}</small></div>`;return h+'<div class="pad"></div></div>'};
  return `<div class="wheelset" data-key="${key}" data-val="${esc(val||DEF_BIRTH)}"><div class="wheels">${col('y',cy-8,cy,y0,'년')}${col('m',1,12,m0,'월')}${col('d',1,31,d0,'일')}<i class="band"></i></div>
  <label class="field" style="margin-top:8px">숫자로 바로 입력 (예: 20230115)<input class="wtxt" type="text" inputmode="numeric" maxlength="10" placeholder="20230115" value="${(val||DEF_BIRTH).replace(/-/g,'')}"></label></div>`;

function wheelInit(ws){
  const key=ws.dataset.key,IH=40,txt=ws.querySelector('.wtxt');
  const W={y:ws.querySelector('[data-w=y]'),m:ws.querySelector('[data-w=m]'),d:ws.querySelector('[data-w=d]')};
  const items=el=>[...el.querySelectorAll('.wi')];
  const get=el=>{const it=items(el),i=Math.max(0,Math.min(it.length-1,Math.round(el.scrollTop/IH)));return Number(it[i].dataset.v)};
  const setW=(el,v)=>{const it=items(el);let i=it.findIndex(x=>Number(x.dataset.v)===v);if(i<0)i=0;el.scrollTop=i*IH};
  const dim=(y,m)=>{const n=new Date(y,m,0).getDate();items(W.d).forEach(x=>x.classList.toggle('off',Number(x.dataset.v)>n));return n};
  const commit=fromTxt=>{
    const y=get(W.y),m=get(W.m);let d=get(W.d);const n=dim(y,m);
    if(d>n){d=n;setW(W.d,d)}
    E[key]=y+'-'+p2(m)+'-'+p2(d);
    if(!fromTxt)txt.value=y+p2(m)+p2(d);
  };
  const [y0,m0,d0]=ws.dataset.val.split('-').map(Number);
  setW(W.y,y0);setW(W.m,m0);setW(W.d,d0);commit(false);
  Object.keys(W).forEach(k=>{
    let t;W[k].addEventListener('scroll',()=>{E.wt=Date.now();clearTimeout(t);t=setTimeout(()=>commit(false),70)});
    W[k].addEventListener('click',e=>{const it=e.target.closest('.wi');if(it)W[k].scrollTo({top:items(W[k]).indexOf(it)*IH,behavior:'smooth'})});
  });
  txt.addEventListener('input',()=>{
    const dg=txt.value.replace(/\D/g,'');if(dg.length!==8)return;
    const y=Number(dg.slice(0,4)),m=Number(dg.slice(4,6)),d=Number(dg.slice(6,8)),cy=new Date().getFullYear();
    if(y<cy-8||y>cy||m<1||m>12||d<1||d>new Date(y,m,0).getDate()){toast('날짜를 확인해 주세요.');return}
    setW(W.y,y);setW(W.m,m);setW(W.d,d);commit(true);
    if(document.getElementById('s-sex')){txt.blur();scrollToSoon('#s-sex')}
  });
}

/* ---------- 저장소 어댑터 ----------
   Artifact 런타임(claude.use)이 있으면 그대로 쓰고, 없으면(일반 브라우저·GitHub Pages·테스트) localStorage 로컬 저장소를 쓴다.
   앱 코드는 doc(path).set/get/onSnapshot, collection(name).orderBy().limit().onSnapshot, user.id/can 만 호출한다.
   나중에 Firebase 등으로 바꿀 때는 아래 localBackend 자리에 같은 모양의 객체만 넣으면 된다. */
function localBackend(){
  const KEY=DEV.on?'dpn_db_dev':'dpn_db',subs=new Set();
  let store={};
  const load=()=>{try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){throw Object.assign(new Error('storage'),{code:'storage'})}};
  const fire=()=>subs.forEach(f=>f());
  E.local=true;load();
  window.addEventListener('storage',e=>{if(e.key===KEY){load();fire()}});
  const snapDoc=p=>({exists:p in store,id:p.split('/').pop(),data:()=>store[p]});
  const doc=p=>({
    set:async d=>{store[p]=JSON.parse(JSON.stringify(d));save();fire()},
    get:async()=>snapDoc(p),
    onSnapshot:cb=>{const f=()=>cb(snapDoc(p));subs.add(f);f();return()=>subs.delete(f)}
  });
  const collection=name=>{
    const o={f:null,dir:'asc',n:0};
    const rows=()=>{
      let r=Object.keys(store).filter(k=>k.startsWith(name+'/')&&k.split('/').length===2).map(k=>({id:k.split('/')[1],data:()=>store[k]}));
      if(o.f)r.sort((a,b)=>{const x=a.data()[o.f],y=b.data()[o.f];return(x<y?-1:x>y?1:0)*(o.dir==='desc'?-1:1)});
      return o.n?r.slice(0,o.n):r;
    };
    const q={
      orderBy:(f,dir)=>{o.f=f;o.dir=dir||'asc';return q},
      limit:n=>{o.n=n;return q},
      get:async()=>({docs:rows()}),
      onSnapshot:cb=>{const f=()=>cb({docs:rows()});subs.add(f);f();return()=>subs.delete(f)}
    };
    return q;
  };
  // WHO 기준표가 저장소에 없으면 data/who/ 에서 한 번 불러와 채운다 (http 로 열었을 때만 동작)
  const seed=async()=>{
    for(const k of ['wfa_m','wfa_f','lfa_m','lfa_f']){
      if(('ref/'+k) in store)continue;
      try{const r=await fetch('data/who/doc_'+k+'.json');if(r.ok){store['ref/'+k]=await r.json()}}catch(e){}
    }
    try{save()}catch(e){}fire();
  };
  setTimeout(seed,0);
  return {db:{doc,collection},user:{id:async()=>'local',can:async()=>true}};
}

    const o={f:null,dir:'asc',n:0};
    const mk=()=>{const cs=[];if(o.f)cs.push(F.orderBy(o.f,o.dir));if(o.n)cs.push(F.limit(o.n));return F.query(F.collection(db,`families/${fid}/${name}`),...cs)};
    const q={orderBy:(f,d)=>{o.f=f;o.dir=d||'asc';return q},limit:n=>{o.n=n;return q},
      get:async()=>{const s=await F.getDocs(mk());return{docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}},
      onSnapshot:(cb,er)=>F.onSnapshot(mk(),s=>cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),er)};
    return q;
  };
  return{db:{doc,collection},user:{id:async()=>uid,can:async()=>true},uid};
}
/* 연결이 끊겼을 때: 쓰기를 막고 안내만 보여 준다 (엉뚱한 곳에 저장되는 것 방지) */
function stubBackend(){
  const doc=()=>({set:async()=>{},get:async()=>({exists:false,data:()=>({})}),onSnapshot:()=>()=>{}});
  const collection=()=>{const q={orderBy:()=>q,limit:()=>q,get:async()=>({docs:[]}),onSnapshot:cb=>{cb({docs:[]});return()=>{}}};return q};
  return{db:{doc,collection},user:{id:async()=>null,can:async()=>false}};
}
async function getBackend(){
  try{if(typeof claude!=='undefined'&&claude&&claude.use){return{db:await claude.use('db'),user:await claude.use('user')}}}catch(e){}

      try{const b=await familyBackend(fam.fid);E.famUid=b.uid;return b}
      catch(e){E.famFail=String((e&&e.message)||e);E.canWrite=false;return stubBackend()}
    }
  }

async function migrateLocal(fid){
  const {db,F}=await fbLoad();let store={};
  try{store=JSON.parse(localStorage.getItem(DEV.on?'dpn_db_dev':'dpn_db')||'{}')}catch(e){}
  const paths=Object.keys(store).filter(k=>!k.startsWith('ref/')&&!k.startsWith('data/users/')&&k.split('/').length===2);
  for(let i=0;i<paths.length;i+=400){
    const b=F.writeBatch(db);paths.slice(i,i+400).forEach(k=>b.set(F.doc(db,`families/${fid}/${k}`),store[k]));await b.commit();
  }
  return paths.length;
}
async function createFamily(){

async function joinCheck(code){

/* 가족을 만든 사람이 역할을 잘못 골랐을 때(상대가 아직 합류 전일 때만): 내 역할을 바꾸고 새 초대 코드를 만든다 */
async function switchFamilyRole(){
  const fam=lsGet(FAM_KEY,null);if(!fam)return{err:'연결 정보가 없어요.'};
  if((S.members||[]).some(m=>m.role!==fam.role))return{err:'상대가 이미 합류해서 바꿀 수 없어요. 두 폰 모두 연결을 해제한 뒤 다시 시작해 주세요.'};
  const nr=fam.role==='mom'?'dad':'mom',old=fam.role;
  const {db,F}=await fbLoad();const uid=await fbUid();
  try{
    const b1=F.writeBatch(db);
    b1.delete(F.doc(db,`families/${fam.fid}/members/${uid}`));b1.delete(F.doc(db,`families/${fam.fid}/roles/${old}`));
    await b1.commit();
  }catch(e){return{err:'바꾸지 못했어요. 인터넷 연결을 확인해 주세요.'}}
  const code=genCode(),now=Date.now(),exp=now+7*864e5;
  const b2=F.writeBatch(db);
  b2.set(F.doc(db,`families/${fam.fid}/members/${uid}`),{role:nr,joinedAt:now,seen:0});
  b2.set(F.doc(db,`families/${fam.fid}/roles/${nr}`),{uid,at:now});
  b2.set(F.doc(db,'invites/'+code),{familyId:fam.fid,role:old,createdBy:uid,usedBy:null,expiresAt:exp,createdAt:now});
  b2.set(F.doc(db,'users/'+uid),{familyId:fam.fid,role:nr});
  let ok=false;for(let i=0;i<2&&!ok;i++){try{await b2.commit();ok=true}catch(e){await new Promise(r=>setTimeout(r,800))}}
  if(!ok)return{err:'역할을 바꾸는 중 연결이 끊겼어요. 의견 탭에서 이 폰 연결을 해제한 뒤 다시 시작해 주세요.'};
  lsSet(FAM_KEY,{fid:fam.fid,role:nr,code,codeExp:exp});try{localStorage.setItem('role',nr)}catch(e){}
  return{ok:true};
}
async function leaveFamily(){
  const fam=lsGet(FAM_KEY,null);if(!fam)return;
  try{
    const {db,F}=await fbLoad();const uid=await fbUid();
    const b=F.writeBatch(db);
    b.delete(F.doc(db,`families/${fam.fid}/members/${uid}`));b.delete(F.doc(db,`families/${fam.fid}/roles/${fam.role}`));b.delete(F.doc(db,'users/'+uid));
    await b.commit();
  }catch(e){}
  lsSet(FAM_KEY,null);
}
async function deleteFamilyData(){
  const fam=lsGet(FAM_KEY,null);if(!fam)return 0;
  const {db,F}=await fbLoad();let n=0;
  for(const c of FAM_COLLS){
    const s=await F.getDocs(F.collection(db,`families/${fam.fid}/${c}`));
    for(let i=0;i<s.docs.length;i+=400){const b=F.writeBatch(db);s.docs.slice(i,i+400).forEach(d=>b.delete(d.ref||F.doc(db,`families/${fam.fid}/${c}/${d.id}`)));await b.commit();n+=Math.min(400,s.docs.length-i)}
  }
  return n;
}

  db.collection('memo').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.memo=o;render()},er);
  db.collection('shelf').orderBy('ts','desc').limit(300).onSnapshot(q=>{S.shelf=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},er);
  db.collection('growth').limit(1000).onSnapshot(q=>{S.growth=q.docs.map(d=>d.data());render()},er);
  render();
})();
</script>
