<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>15분 놀이수첩</title>
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B7A66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="놀이수첩">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 폰 한 손 사용 기준. 상단은 아이 이름·월령 한 줄, 하단 고정 탭 4개, 본문은 "지금 할 것" 카드 한 장 + 접이식 보조 항목. 초록 계열 한 가지 포인트, 숫자는 Do Hyeon. */
:root{
  --bg:#F3F6F2; --card:#FFFFFF; --ink:#1C2825; --ink2:#62716B; --line:#E1E7E2; --soft:#E9F2EE;
  --pri:#2B7A66; --pri-ink:#FFFFFF; --sun:#F6C85F; --sun-ink:#2B2310;
  --d-soc:#C0504D; --d-lang:#2B5FB0; --d-cog:#7A4FA0; --d-mov:#1F7F8C;
  --lv1:#C98A12; --lv2:#2E8B57; --warn-bg:#FFF5DB; --warn-line:#EBD088; --bad:#C65A55;
  --shadow:0 1px 2px rgba(20,45,38,.06),0 6px 18px rgba(20,45,38,.05);
  --f-num:'Do Hyeon','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --card:#17201D; --ink:#E6EEEA; --ink2:#94A49D; --line:#26312D; --soft:#1E2B27;
    --pri:#5DBBA4; --pri-ink:#0D1A16; --sun:#E2B34A; --sun-ink:#1B1608;
    --d-soc:#E88A85; --d-lang:#86ABEA; --d-cog:#BC9CDF; --d-mov:#5CC0CE;
    --lv1:#E3B04B; --lv2:#5FC48A; --warn-bg:#2B2614; --warn-line:#6B5A22; --bad:#E88A85; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --card:#17201D; --ink:#E6EEEA; --ink2:#94A49D; --line:#26312D; --soft:#1E2B27;
  --pri:#5DBBA4; --pri-ink:#0D1A16; --sun:#E2B34A; --sun-ink:#1B1608;
  --d-soc:#E88A85; --d-lang:#86ABEA; --d-cog:#BC9CDF; --d-mov:#5CC0CE;
  --lv1:#E3B04B; --lv2:#5FC48A; --warn-bg:#2B2614; --warn-line:#6B5A22; --bad:#E88A85; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}
.wrap{max-width:560px;margin:0 auto}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 0 14px}
.who{font-size:13px;color:var(--ink2)}
.age{font-family:var(--f-num);font-size:30px;line-height:1.1}
.age small{font-size:16px;margin:0 4px 0 1px;color:var(--ink2)}
.pill-btn{font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink2);cursor:pointer}
.pill-btn[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav{display:flex;max-width:560px;margin:0 auto}
nav button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:11px;font-weight:700;padding:6px 0;border:0;background:none;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected="true"]{color:var(--pri)}
nav .dot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;line-height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;font-style:normal;text-align:center;padding:0 4px}
nav button:focus-visible,.btn:focus-visible,.seg button:focus-visible,summary:focus-visible,input:focus-visible,.pill-btn:focus-visible{outline:3px solid var(--d-lang);outline-offset:2px}
main{display:flex;flex-direction:column;gap:14px}
.card,.hero,.fold{background:var(--card);border-radius:20px;box-shadow:var(--shadow);min-width:0}
.card,.hero{padding:18px}
.hero,.today-card{padding:20px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
.muted{color:var(--ink2);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{font:inherit;font-weight:700;border:0;background:var(--pri);color:var(--pri-ink);border-radius:14px;padding:13px 18px;cursor:pointer}
.btn.big{width:100%;font-size:17px;padding:16px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:99px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{font:inherit;font-size:13px;background:none;border:0;color:var(--ink2);text-decoration:underline;cursor:pointer;padding:6px 0}
.seg{display:inline-flex;background:var(--soft);border-radius:14px;padding:3px;gap:3px;max-width:100%}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;padding-inline:4px;white-space:nowrap}
.seg button{font:inherit;font-size:14px;font-weight:500;background:transparent;color:var(--ink2);border:0;border-radius:11px;padding:10px 12px;cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);font-weight:700}
.seg button:disabled{cursor:not-allowed;opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:currentColor}
.c-soc{color:var(--d-soc)}.c-lang{color:var(--d-lang)}.c-cog{color:var(--d-cog)}.c-mov{color:var(--d-mov)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink2)}
.order{font-family:var(--f-num);font-weight:400;font-size:30px;line-height:1.2;margin:6px 0 10px}
.src{font-size:12px;color:var(--ink2)}
.status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px}
.status.ok{background:var(--lv2);color:#fff}
.status.todo{background:var(--sun);color:var(--sun-ink)}
:root[data-theme="dark"] .status.ok{color:#0D1A16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .status.ok{color:#0D1A16}}
ol.steps{margin:14px 0 4px;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;position:relative;padding-left:32px;font-size:16px;line-height:1.5}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--soft);color:var(--pri);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.extra{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px}
.timerbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.timer{font-family:var(--f-num);font-size:60px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.btn.go{min-width:112px;font-size:18px;padding:16px 22px;border-radius:99px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.field input{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:12px;padding:12px;width:100%;min-width:0}
.q{font-size:13px;color:var(--ink2);margin:14px 0 6px}
.msg{border-radius:14px;padding:11px 14px;background:var(--soft);font-size:14px}
.msg.praise{background:color-mix(in srgb,var(--lv2) 16%,var(--card))}
.msg.push{background:var(--warn-bg)}
.msg small{display:block;color:var(--ink2);font-size:11px;margin-top:2px}
.msg .by{font-size:11px;font-weight:700;color:var(--ink2);display:block}
.msgbox{display:flex;flex-direction:column;gap:8px}
.msglist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.msglist button{text-align:left}
.fold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;font-weight:700;font-size:14px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin:-4px 2px 0 0;flex:none;transition:transform .2s}
.fold[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.fold>summary .sub{font-weight:400;font-size:13px;color:var(--ink2);margin-left:6px}
.fbody{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
.item{padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.item:first-child{border-top:0;padding-top:0}
.item ol{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.alt{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:12px;padding:8px 12px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink2)}
.tag.ok{background:var(--lv2);color:#fff}
:root[data-theme="dark"] .tag.ok{color:#0D1A16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.ok{color:#0D1A16}}
.lib{padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.lib:first-of-type{border-top:0;padding-top:0}
.lib ol{margin:0;padding-left:20px;font-size:13px;color:var(--ink2)}
.bigstat{display:flex;align-items:baseline;gap:6px;margin:6px 0 12px}
.bigstat b{font-family:var(--f-num);font-weight:400;font-size:56px;line-height:1}
.bigstat span{font-size:18px;color:var(--ink2)}
.bigstat em{font-style:normal;margin-left:auto;font-size:13px;font-weight:700;color:var(--pri)}
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.dd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink2)}
.dd i{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;background:var(--soft);display:block}
.dd.on i{background:var(--pri)}
.summary{font-size:15px;line-height:1.6;text-wrap:pretty}
.summary b{background:linear-gradient(transparent 62%,var(--sun) 62%)}
.dom-row{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.dom-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.dom-head .n{font-weight:700}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:currentColor}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.lv0{background:var(--soft);color:var(--ink2)}
.lv1{background:var(--lv1);color:#fff}
.lv2{background:var(--lv2);color:#fff}
:root[data-theme="dark"] .lv1,:root[data-theme="dark"] .lv2{color:#0D1A16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv1,:root:not([data-theme="light"]) .lv2{color:#0D1A16}}
.msgrid{display:flex;flex-direction:column}
.msgrid div,.erow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.msgrid div:first-child{border-top:0}
.erow button{font:inherit;font-size:12px;padding:6px 10px;border:0;border-radius:99px;background:var(--soft);color:var(--ink);cursor:pointer;flex:none}
.notice{background:var(--warn-bg);border-radius:16px;padding:14px 16px;font-size:14px}
ul.plain{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.empty{padding:14px;border-radius:14px;background:var(--soft);color:var(--ink2);font-size:14px}
.lead{font-size:14px;color:var(--ink2);padding:0 2px}
.lead b{color:var(--ink);font-family:var(--f-num);font-weight:400;font-size:18px}
.ms{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.ms:first-of-type{border-top:0}
.ms details summary{cursor:pointer;list-style:none;font-size:15px;line-height:1.45}
.ms details summary::-webkit-details-marker{display:none}
.ms .how{font-size:13px;color:var(--ink2);margin-top:4px}
.ms .seg button{padding:9px 6px;font-size:13.5px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.pos div{background:var(--soft);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:2px}
.pos b{font-family:var(--f-num);font-weight:400;font-size:38px;line-height:1}
.pos b small{font-size:15px;margin-left:2px;color:var(--ink2)}
.pos span{font-size:12px;color:var(--ink2)}
.step{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center}
.step input{text-align:center;font-family:var(--f-num);font-size:28px;min-width:0;padding:8px;background:var(--soft);color:var(--ink);border:1px solid transparent;border-radius:12px;width:100%}
.step button{font:inherit;font-size:24px;font-weight:700;height:48px;border-radius:14px;border:0;background:var(--soft);color:var(--ink);cursor:pointer}
.ch{width:100%;height:auto;display:block}
.ch text{font-family:var(--f-body);font-size:11px;fill:var(--ink2)}
.ch .grid{stroke:var(--line);stroke-width:1}
.ch .ref{fill:none;stroke:var(--ink2);stroke-width:1;opacity:.5}
.ch .ref50{fill:none;stroke:var(--ink2);stroke-width:1.6}
.ch .agg{fill:none;stroke:var(--d-lang);stroke-width:1.6;stroke-dasharray:4 3}
.ch .aggp{fill:var(--d-lang)}
.ch .me{fill:none;stroke:var(--pri);stroke-width:2.4}
.ch .mep{fill:var(--sun);stroke:var(--pri);stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--pri);vertical-align:middle;margin-right:5px}
.legend i.a{border-top:2px dashed var(--d-lang)}
.legend i.r{border-top:2px solid var(--ink2);opacity:.6}
.feat{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.feat:first-of-type{border-top:0}
.chlog{font-size:13px;color:var(--ink2)}
.chlog b{color:var(--ink)}
.wheels{position:relative;display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;margin-top:6px}
.wheel{height:200px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);touch-action:pan-y}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:80px}
.wi{height:40px;line-height:40px;text-align:center;scroll-snap-align:center;font-size:20px;font-weight:700;color:var(--ink2);cursor:pointer;user-select:none}
.wi small{font-size:12px;font-weight:400;margin-left:2px}
.wi.off{opacity:.25}
.wheels .band{position:absolute;left:0;right:0;top:80px;height:40px;background:var(--soft);border-radius:12px;pointer-events:none;opacity:.55;mix-blend-mode:multiply}
.foot{margin-top:18px;font-size:12px;color:var(--ink2);line-height:1.6}
.foot summary{cursor:pointer;font-weight:700}
.foot p{margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}

/* ===== v0.7.2 모바일 보정 ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:anywhere}
button,summary,.seg button,.pill-btn,nav button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font-size:16px}
header.top{padding-top:calc(18px + env(safe-area-inset-top,0px))}
.btn.sm{min-height:40px}
.seg button{min-height:44px}
nav button{min-height:52px}
summary{min-height:44px;display:flex;align-items:center}
.wheel{touch-action:pan-y}
@media (max-width:360px){.age{font-size:26px}.order{font-size:26px}.timer{font-size:52px}}

/* ===== v0.8 스크롤 여백·개발자 패널 ===== */
.hero .q,#ssave{scroll-margin-top:16px;scroll-margin-bottom:120px}
#dev{position:fixed;right:10px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30}
#devtog{font:inherit;font-size:12px;font-weight:700;width:46px;height:46px;border-radius:50%;border:0;background:#22303A;color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.3);opacity:.9}
#devtog.shifted{background:#D9822B}
#devbody{position:fixed;left:10px;right:10px;bottom:calc(132px + env(safe-area-inset-bottom,0px));max-height:62vh;overflow:auto;background:var(--card);color:var(--ink);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.28);padding:14px;font-size:13px;-webkit-overflow-scrolling:touch}
#devbody[hidden]{display:none}
nav button[hidden]{display:none}
.dv-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
.dv-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dv-row input{font:inherit;font-size:16px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.dv-t{width:100%;border-collapse:collapse;font-size:12.5px}
.dv-t td{padding:4px 6px;border-top:1px solid var(--line)}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div><div class="who" id="who"></div><div class="age" id="age"></div></div>
    <button class="pill-btn" id="confbtn" data-tab="conf" aria-pressed="false">의견</button>
  </header>
  <main id="main"></main>
  <details class="foot"><summary>출처·참고용 안내·저장 방식</summary><p id="foot"></p></details>
</div>
<div class="tabbar"><nav role="tablist" aria-label="화면">
  <button role="tab" data-tab="dad"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg><span>아빠의 놀이</span><i class="dot" hidden></i></button>
  <button role="tab" data-tab="check"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg><span>발달 체크</span></button>
  <button role="tab" data-tab="grow"><svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M6 16l4-5 3 3 5-7"/></svg><span>키·몸무게</span></button>
  <button role="tab" data-tab="mom"><svg viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg><span>엄마의 눈</span><i class="dot" hidden></i></button>
</nav></div>
<div id="toast" hidden></div>

<script>
/* ---------- 개발자 모드 (?dev=1 로 켜고 ?dev=0 으로 끔): 기준 날짜를 옮겨 월령·일자별 화면을 확인 ----------

/* ---------- 계산 ---------- */
function need(card){return card.ms.reduce((s,id)=>s+(2-lv(id)),0)}
function cardPool(){const mo=ageFloat(),ok=c=>DRAFT()||c.ready!==false;let p=CARDS.filter(c=>ok(c)&&mo>=c.age[0]&&mo<c.age[1]);if(p.length<4)p=CARDS.filter(ok);return p}
function ranked(){return cardPool().slice().sort((a,b)=>need(b)-need(a)||CARDS.indexOf(a)-CARDS.indexOf(b))}
function dayAgo(n){const d=new Date();d.setDate(d.getDate()-n);return ymd(d)}
function pickToday(){
  if(S.assign[today()]&&cardById(S.assign[today()]))return S.assign[today()];
  const recent=new Set(S.plays.filter(p=>p.date>=dayAgo(5)).map(p=>p.card));
  let pool=ranked().filter(c=>!recent.has(c.id));if(pool.length<4)pool=ranked();
  const top=pool.slice(0,6);return top[dayNum()%top.length].id;
}
function domScore(d){const l=MS.filter(m=>m.d===d);const got=l.filter(m=>lv(m.id)===2).length;const pts=l.reduce((s,m)=>s+lv(m.id),0);return{n:l.length,got,pct:Math.round(pts/(2*l.length)*100)}}
function lastDays(n){const out=[];for(let i=n-1;i>=0;i--)out.push(dayAgo(i));return out}
function minsOn(date){return S.plays.filter(p=>p.date===date).reduce((s,p)=>s+p.mins,0)}
function streak(){let n=0;const d=new Date();if(!minsOn(ymd(d)))d.setDate(d.getDate()-1);while(minsOn(ymd(d))>0){n++;d.setDate(d.getDate()-1)}return n}

/* ---------- 성장 계산 (LMS 기준표는 ref/* 문서에 있을 때만 사용) ---------- */
const refKey=k=>(k==='h'?'lfa_':'wfa_')+S.cfg.sex;
function lmsAt(key,mo){
  const r=S.ref[key];if(!r||!r.length)return null;
  if(mo<r[0][0]||mo>r[r.length-1][0])return null;
  let i=0;while(i<r.length-1&&r[i+1][0]<=mo)i++;
  const a=r[i],b=r[Math.min(i+1,r.length-1)];
  if(a===b||b[0]===a[0])return{L:a[1],M:a[2],S:a[3]};
  const t=(mo-a[0])/(b[0]-a[0]);
  return{L:a[1]+(b[1]-a[1])*t,M:a[2]+(b[2]-a[2])*t,S:a[3]+(b[3]-a[3])*t};
}
function zOf(kind,mo,x){const p=lmsAt(refKey(kind),mo);if(!p)return null;return p.L===0?Math.log(x/p.M)/p.S:(Math.pow(x/p.M,p.L)-1)/(p.L*p.S)}
function valAt(kind,mo,z){const p=lmsAt(refKey(kind),mo);if(!p)return null;return p.L===0?p.M*Math.exp(p.S*z):p.M*Math.pow(1+p.L*p.S*z,1/p.L)}
function cdf(z){const t=1/(1+0.2316419*Math.abs(z));const d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const hard=(h,w)=>h>=40&&h<=140&&w>=2&&w<=40;
function aggRows(sex){
  const m=new Map();
  for(const g of S.growth)for(const r of Object.values(g.rows||{})){if(r&&r.ck)m.set(r.ck+'_'+Math.round(r.m),r)}
  const out=[];
  for(const r of m.values()){
    if(r.x||r.s!==sex||!hard(r.h,r.w))continue;
    const zh=zOf('h',r.m,r.h),zw=zOf('w',r.m,r.w);
    if((zh!=null&&Math.abs(zh)>4)||(zw!=null&&Math.abs(zw)>4))continue;
    out.push(r);
  }
  return out;
}
function aggMean(kind){
  if(E.local)return {};
  const rows=aggRows(S.cfg.sex),b={};
  for(const r of rows){const k=Math.round(r.m);(b[k]=b[k]||[]).push(r[kind])}
  const o={};for(const k in b)o[k]={mean:b[k].reduce((s,x)=>s+x,0)/b[k].length,n:b[k].length};
  return o;
}
async function contribute(rec){
  if(!E.db||!E.uid||!S.cfg.ck)return;
  try{
    const ref=E.db.doc('growth/'+E.uid);const s=await ref.get();
    const rows=Object.assign({},(s.exists&&s.data().rows)||{});
    rows[S.cfg.ck+'_'+Math.round(rec.mo)]={ck:S.cfg.ck,m:rec.mo,s:S.cfg.sex,h:rec.h,w:rec.w,x:rec.x?1:0};
    await ref.set({rows});
  }catch(e){}
}
function trySaveBody(){
  const h=E.gh,w=E.gw;
  if(!hard(h,w)){E.gwarn={hard:true,msg:'키는 40~140cm, 몸무게는 2~40kg 범위로 입력해 주세요. 단위(cm, kg)를 확인해 주세요.'};render();return}
  const mo=ageFloat(),zh=zOf('h',mo,h),zw=zOf('w',mo,w);
  if((zh!=null&&Math.abs(zh)>3)||(zw!=null&&Math.abs(zw)>3)){
    const why=[];if(zh!=null&&Math.abs(zh)>3)why.push('키');if(zw!=null&&Math.abs(zw)>3)why.push('몸무게');
    E.gwarn={hard:false,msg:why.join('와 ')+' 값이 같은 월령 표준에서 많이 벗어났어요. 오타나 단위가 맞는지 확인해 주세요. 맞는 값이면 통계에 넣을지 정해 주세요.'};render();return;
  }

function wheelInit(ws){
  const key=ws.dataset.key,IH=40,txt=ws.querySelector('.wtxt');
  const W={y:ws.querySelector('[data-w=y]'),m:ws.querySelector('[data-w=m]'),d:ws.querySelector('[data-w=d]')};
  const items=el=>[...el.querySelectorAll('.wi')];
  const get=el=>{const it=items(el),i=Math.max(0,Math.min(it.length-1,Math.round(el.scrollTop/IH)));return Number(it[i].dataset.v)};
  const setW=(el,v)=>{const it=items(el);let i=it.findIndex(x=>Number(x.dataset.v)===v);if(i<0)i=0;el.scrollTop=i*IH};
  const dim=(y,m)=>{const n=new Date(y,m,0).getDate();items(W.d).forEach(x=>x.classList.toggle('off',Number(x.dataset.v)>n));return n};
  const commit=fromTxt=>{

    E[key]=y+'-'+p2(m)+'-'+p2(d);

  };
  const [y0,m0,d0]=ws.dataset.val.split('-').map(Number);
  setW(W.y,y0);setW(W.m,m0);setW(W.d,d0);commit(false);
  Object.keys(W).forEach(k=>{
    let t;W[k].addEventListener('scroll',()=>{E.wt=Date.now();clearTimeout(t);t=setTimeout(()=>commit(false),70)});
    W[k].addEventListener('click',e=>{const it=e.target.closest('.wi');if(it)W[k].scrollTo({top:items(W[k]).indexOf(it)*IH,behavior:'smooth'})});
  });
  txt.addEventListener('input',()=>{
    const dg=txt.value.replace(/\D/g,'');if(dg.length!==8)return;
    const y=Number(dg.slice(0,4)),m=Number(dg.slice(4,6)),d=Number(dg.slice(6,8)),cy=new Date().getFullYear();

    setW(W.y,y);setW(W.m,m);setW(W.d,d);commit(true);
    if(document.getElementById('s-sex')){txt.blur();scrollToSoon('#s-sex')}
  });
}

/* ---------- 저장소 어댑터 ----------
   Artifact 런타임(claude.use)이 있으면 그대로 쓰고, 없으면(일반 브라우저·GitHub Pages·테스트) localStorage 로컬 저장소를 쓴다.
   앱 코드는 doc(path).set/get/onSnapshot, collection(name).orderBy().limit().onSnapshot, user.id/can 만 호출한다.
   나중에 Firebase 등으로 바꿀 때는 아래 localBackend 자리에 같은 모양의 객체만 넣으면 된다. */
function localBackend(){
  const KEY=DEV.on?'dpn_db_dev':'dpn_db',subs=new Set();
  let store={};
  const load=()=>{try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}};
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){throw Object.assign(new Error('storage'),{code:'storage'})}};
  const fire=()=>subs.forEach(f=>f());
  E.local=true;load();
  window.addEventListener('storage',e=>{if(e.key===KEY){load();fire()}});
  const snapDoc=p=>({exists:p in store,id:p.split('/').pop(),data:()=>store[p]});
  const doc=p=>({
    set:async d=>{store[p]=JSON.parse(JSON.stringify(d));save();fire()},
    get:async()=>snapDoc(p),
    onSnapshot:cb=>{const f=()=>cb(snapDoc(p));subs.add(f);f();return()=>subs.delete(f)}
  });
  const collection=name=>{
    const o={f:null,dir:'asc',n:0};
    const rows=()=>{
      let r=Object.keys(store).filter(k=>k.startsWith(name+'/')&&k.split('/').length===2).map(k=>({id:k.split('/')[1],data:()=>store[k]}));
      if(o.f)r.sort((a,b)=>{const x=a.data()[o.f],y=b.data()[o.f];return(x<y?-1:x>y?1:0)*(o.dir==='desc'?-1:1)});
      return o.n?r.slice(0,o.n):r;
    };
    const q={
      orderBy:(f,dir)=>{o.f=f;o.dir=dir||'asc';return q},
      limit:n=>{o.n=n;return q},
      get:async()=>({docs:rows()}),
      onSnapshot:cb=>{const f=()=>cb({docs:rows()});subs.add(f);f();return()=>subs.delete(f)}
    };
    return q;
  };
  // WHO 기준표가 저장소에 없으면 data/who/ 에서 한 번 불러와 채운다 (http 로 열었을 때만 동작)
  const seed=async()=>{
    for(const k of ['wfa_m','wfa_f','lfa_m','lfa_f']){
      if(('ref/'+k) in store)continue;
      try{const r=await fetch('data/who/doc_'+k+'.json');if(r.ok){store['ref/'+k]=await r.json()}}catch(e){}
    }
    try{save()}catch(e){}fire();
  };
  setTimeout(seed,0);
  return {db:{doc,collection},user:{id:async()=>'local',can:async()=>true}};
}
async function getBackend(){
  try{if(typeof claude!=='undefined'&&claude&&claude.use){return{db:await claude.use('db'),user:await claude.use('user')}}}catch(e){}
  return localBackend();
}

/* PWA: Artifact 안이 아닐 때만 서비스 워커 등록 (http/https 에서만 동작) */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&typeof claude==='undefined'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

  if(!location.hash){E.tab=E.role==='mom'||(!E.canWrite&&!E.role)?'mom':'dad'}
  const er=e=>{if(e&&e.code==='revoked'){E.db=null;render()}};
  db.doc('config/child').onSnapshot(s=>{if(s.exists){S.cfg=Object.assign({},S.cfg,s.data());E.cfgSet=true}render()},er);
  db.collection('ms').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.ms=o;render()},er);
  db.collection('plays').orderBy('ts','desc').limit(300).onSnapshot(q=>{S.plays=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},er);
  db.collection('log').orderBy('ts','desc').limit(300).onSnapshot(q=>{S.log=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},er);
  db.collection('body').orderBy('ts','desc').limit(200).onSnapshot(q=>{S.body=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},er);
  db.collection('assign').onSnapshot(q=>{const o={};q.docs.forEach(d=>{o[d.id]=d.data().cardId});S.assign=o;render()},er);
  db.collection('ref').onSnapshot(q=>{const o={};q.docs.forEach(d=>{const r=d.data().rows;if(Array.isArray(r))o[d.id]=r});S.ref=o;render()},er);
  db.collection('msgs').orderBy('ts','desc').limit(60).onSnapshot(q=>{S.msgs=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},er);
  db.collection('conf').onSnapshot(q=>{const o={};q.docs.forEach(d=>o[d.id]=d.data());S.conf=o;render()},er);
  db.collection('fb').orderBy('ts','desc').limit(60).onSnapshot(q=>{S.fb=q.docs.map(d=>Object.assign({id:d.id},d.data()));render()},er);
  db.collection('growth').limit(1000).onSnapshot(q=>{S.growth=q.docs.map(d=>d.data());render()},er);
  render();
})();
</script>
</body>
</html>
