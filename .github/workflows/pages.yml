# GitHub Pages 자동 배포: main 에 푸시하면 정적 파일을 그대로 공개한다. (서버 없음, 무료)
# 필요한 일회성 설정: 저장소 Settings → Pages → Source = "GitHub Actions"
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 공개할 파일만 모으기
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest _site/
          cp -r icons data _site/
          rm -f _site/data/who/*.csv
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
